name: "CI - Feature version guard"
on:
  pull_request:

jobs:
  feature-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: "Test version guard"
        run: bash .github/scripts/check-feature-version-bumps.test.sh

      - name: "Require version bumps for shipped feature changes"
        run: bash .github/scripts/check-feature-version-bumps.sh "${{ github.event.pull_request.base.sha }}" HEAD
