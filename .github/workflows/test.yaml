name: "CI - Test Features"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  static:
    name: "Static checks"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install ShellCheck"
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: "Check shell syntax"
        run: >-
          find . -type f \( -name '*.sh' -o -path './src/*/cmd/*' \)
          -not -path './.git/*' -print0 | xargs -0 -r bash -n

      - name: "Run ShellCheck"
        # Gate actionable errors/warnings; keep info/style findings advisory.
        run: >-
          find . -type f \( -name '*.sh' -o -path './src/*/cmd/*' \)
          -not -path './.git/*' -print0 | xargs -0 -r shellcheck --severity=warning

      - name: "Run actionlint"
        # The official image bundles ShellCheck; use the same severity policy for inline run blocks.
        run: >-
          docker run --rm
          -e SHELLCHECK_OPTS=--severity=warning
          -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.12

  test-global:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing global scenarios"
        run: devcontainer features test --global-scenarios-only .
